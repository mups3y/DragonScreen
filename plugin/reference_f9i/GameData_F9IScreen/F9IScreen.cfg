// ============================================================================================
//  F9IScreen - the Crew Dragon screen bridge
//
//  Attaches F9IBridgeModule, which is how kOS pushes the message lines and phase strings to the
//  panel. The panel itself is a KSPAddon and needs no patch at all; this file exists ONLY because
//  kOS talks to a PartModule.
//
//  ---- CREW DRAGON ONLY. THE CARGO POD IS DELIBERATELY ABSENT. ----
//  The screen replaces the kOS GUI window for the CREW variant only - Cargo Dragon and the Falcon
//  fairing keep the existing kOS interface, which stays as the working fallback. Adding
//  TE_20_CargoRodan here would put a right-click row and a bridge on a vehicle that will never draw
//  the panel.
//  (F9_LOP's equivalent patch DID list the cargo pod, because a landing planner is needed on both.
//   Copying that pattern verbatim was the obvious mistake here and is not what this does.)
//
//  ---- V2 PODS ONLY. USER'S CALL, 2026-08-04. ----
//  TundraExploration has four candidate pods; only the two DRAGONV2 ones are in scope:
//      TE_18_DRAGONV2_POD      "Rodan Command Pod"           -> FalconCrew   PATCHED
//      TE_18_DRAGONV2_POD_I4   "Rodan Tourism Command Pod"   -> FalconCrew   PATCHED
//      TE_19_C-Dragon_Pod      "Gigan Command Pod"           -> FalconCrew   not in scope
//      TE_20_CargoRodan        "Rodan Cargo Pod"             -> FalconCargo  not in scope
//
//  The Gigan pod is EXCLUDED even though F9I/falcon_detect.ks classifies it as FalconCrew (line ~59,
//  `TE.19.C-Dragon.Pod` -> ShipType "FalconCrew"). That is deliberate: this screen is the Dragon V2
//  display, and Gigan is a different vehicle that happens to share the crew classification.
//  If it is ever wanted, add TE_19_C-Dragon_Pod to the list below - nothing else needs to change.
//
//  NOTE on the _I4 tourism pod: falcon_detect's PRIMARY branch matches only the exact name
//  TE.18.DRAGONV2.POD, so _I4 is recognised solely through its fallback
//  `core:part:name:contains("DRAGONV2.POD")`. It IS a V2 pod, so it is patched here.
//
//  ---- WHY guiActive IS TRUE ON THE BRIDGE FIELD ----
//  kOS REQUIRES guiActive to read or write a PartModule field, so the field cannot be hidden from
//  the right-click menu. That is why the bridge is ONE PACKED STRING rather than thirteen separate
//  fields - one row instead of thirteen. See src/pure/BridgeProtocol.cs.
//
//  :NEEDS[kOS]   - pointless without kOS, since kOS is the only thing that writes to it.
//  :FINAL        - lands after FalconInterface/F9I_FalconCPU.cfg has settled, same as F9_LOP did.
// ============================================================================================
@PART[TE_18_DRAGONV2_POD|TE_18_DRAGONV2_POD_I4]:NEEDS[kOS]:FINAL
{
    MODULE
    {
        name = F9IBridgeModule
    }
}
