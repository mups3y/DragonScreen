// ======================================================================================================
// FALCON 9 SECOND STAGE — RO fix
// WAS: GameData/zzz_TundraRO_Fixes/Falcon9_S2_ROFix.cfg
// ======================================================================================================

// Keep Tundra's Merlin 1D Vacuum (the Falcon 9 second-stage engine) alive under Realism Overhaul.
//
// ---- THE TRAP ----
// This one is NOT HardRemoveNonRO. The S2 engine passes that check cleanly - RO's own
// RealismOverhaul/RO_SuggestedMods/TundraMods/RO_TE_Falcon_9.cfg sets %RSSROConfig = True on it and
// then configures it across ~90 lines, so RO plainly INTENDS this part to exist.
//
// It is ROEngines' PatchManager. ROEngines/PatchManager/ActiveMMPatches/Merlin1.cfg is one line:
//
//     !PART:HAS[~name[ROE-*]&#engineType[Merlin1]&#category[Engine]]:BEFORE[zzzTagCleanup] {}
//
// "Delete every Merlin engine that is not one of ROEngines' own ROE-* parts." Tundra's MVac is exactly
// that, so it was loaded, fully patched by RO, and then DELETED before PartLoader ever compiled it.
// The part never reaches the game and never reaches ModuleManager.ConfigCache, so a save that uses it
// reports "missing part TE.19.F9.S2.Engine" with no error anywhere near the engine itself.
//   Evidence: KSP.log 2026-09-05 00:38:12 - "Applying delete ROEngines/PatchManager/ActiveMMPatches/
//   Merlin1/!PART:HAS[...] to TundraExploration/Parts/Ghidorah9/TE_19_F9_S2_Engine.cfg/PART[...]"
//
// !! WHY IT WORKED BEFORE AND NOT NOW: ROEngines' PatchManager activates a patch by PLACING THE FILE IN
// ActiveMMPatches/ - there is no inactive store, so presence IS activation. The RSS-RO reinstall of
// 2026-09-05 00:14 put Merlin1.cfg there. Nothing on our side changed.
//
// ---- THE ESCAPE, AND WHY THIS ONE ----
// The delete needs ALL THREE of: a non-ROE- name, engineType = Merlin1, and category = Engine.
//   - name      - cannot change; the save, the craft files and OctawebBinding all key off it.
//   - engineType- MUST NOT change; RealismOverhaul/Engine_Configs/Merlin1_Config keys off #engineType
//                 [Merlin1] to give this engine its real thrust, Isp and ignition limits.
//   - category  - free. It is a VAB browser tab and nothing else reads it.
// So category is the only safe lever, and it is not a special case: the S1 octaweb
// (TE_19_F9_S1_Engine) already ships as category = Propulsion, which is the ONLY reason the delete
// skipped it while taking the S2. This puts the MVac on the same tab as the octaweb it flies with.
//
// PASS: :AFTER[zzzRealismOverhaul] is deliberately EARLIER than the delete's :BEFORE[zzzTagCleanup].
// MM walks mods alphabetically, and zzzRealismOverhaul sorts before zzzTagCleanup, so every pass here
// completes before the delete is evaluated. Matching the delete's own pass would be a coin toss decided
// by load order, and "ROEngines" sorts before "zzz_TundraRO_Fixes" - we would lose it.
@PART[TE_19_F9_S2_Engine]:NEEDS[RealismOverhaul]:AFTER[zzzRealismOverhaul]
{
	%category = Propulsion
}


// ======================================================================================================
// FALCON 9 S1 — TestFlight reliability
// WAS: GameData/Crew2_Patches/F9_S1_reliability.cfg
// ======================================================================================================

// ============================================================================
//  Falcon 9 booster Merlin ignition reliability - model the REAL Crew-2 heritage
// ============================================================================
//  Crew-2 flew on booster B1061-2: its SECOND flight, a REUSED, flight-proven
//  Block-5 booster. By 2021 the Merlin 1D's landing-burn ignition record was
//  effectively 100%. TestFlight, in this sandbox install, starts the engine at
//  its FRESH, never-flown value (Merlin1D++ ignitionReliabilityStart = 0.999348),
//  which is wrong for a proven booster - and the octaweb is a CLUSTER, so RO
//  multiplies the failure chance by the engine count, dropping it further.
//
//  ---- ⛔ WHY THE FIRST ATTEMPT (@...:FINAL) DID NOTHING - THE PASS ORDER ----
//  RO's TestFlight_Generic_Engines.cfg builds the reliability the game uses in TWO
//  earlier MM passes:
//    :BEFORE[zTestFlight]  MOVES the TESTFLIGHT{} node OUT of MODULE[ModuleEngineConfigs]
//                          /CONFIG up to the PART.
//    :FOR[zTestFlight]      applies clusterMultiplier and BUILDS the baseIgnitionChance
//                          curve (data-units -> reliability) from ignitionReliabilityStart/End.
//  A patch at :FINAL runs AFTER both: the TESTFLIGHT node is no longer in the CONFIG
//  (so @CONFIG{@TESTFLIGHT} matches nothing) and the curve is already built from the
//  old value. flight_0823_163110 proved it: the landing still rolled IgnitionFail.
//
//  ---- THE FIX: patch the SOURCE value BEFORE RO reads it ----
//  Run at :BEFORE[zTestFlight] and edit the TESTFLIGHT node while it is STILL inside
//  the CONFIG. Crew2_Patches sorts before RealismOverhaul (C < R), so within this pass
//  our edit lands BEFORE RO moves the node; RO then applies its clusterMultiplier and
//  builds the curve from OUR value. Raw 0.99995 -> after a 3-engine cluster penalty
//  ~0.99985 -> after the landing pressureCurve (~0.4 at ~30 kPa) ~0.99994: a proven
//  Block-5 booster, TestFlight fully active, the rare failure now effectively never.
//  (See docs/RO_TESTFLIGHT_MECHANICS.md for the full pipeline.)
//
//  Scope: ONLY the S1 octaweb, all 3 modes (AllEngines/ThreeLanding/CenterOnly) and
//  all 3 thrust configs (Merlin1D/+/++). S2 M-Vac (Merlin1DVac+) is left alone.
//  To revert, delete this file. KSP must be restarted for a config change to load.
// ============================================================================
@PART[TE_19_F9_S1_Engine]:BEFORE[zTestFlight]
{
	@MODULE[Module*EngineConfigs],*
	{
		@CONFIG[Merlin1D*],*
		{
			@TESTFLIGHT
			{
				@ignitionReliabilityStart = 0.99995
				@ignitionReliabilityEnd = 0.99999
				@cycleReliabilityStart = 0.9998
				@cycleReliabilityEnd = 0.99995
			}
		}
	}
}

// ============================================================================
//  ⛔ THE REAL LANDING-BURN KILLER: THE DYNAMIC-PRESSURE IGNITION PENALTY
// ============================================================================
//  MEASURED from the built ConfigCache: the S1 Merlin's TestFlightFailure_IgnitionFail carries a
//  pressureCurve that MULTIPLIES the ignition success chance by dynamic pressure -
//      key = 15000 0.85   ·   key = 30000 0.4   ·   key = 50000 0.15
//  The landing relight fires at ~246 m/s in dense air (~30 kPa q), so success = baseIgnitionChance
//  (0.99995) x 0.4 = 40% -> ~60% FAILURE per attempt, and oneShot=True makes it stick. That, not
//  ullage, crashed the booster into the sea at 243 m/s on flight_0823_222127 and _233243 (IgnitionFail,
//  then all retries fail). A REUSED Block-5 booster (B1061-2) lights its landing engine reliably at
//  exactly this condition - the penalty is a generic-engine artifact, wrong for a flight-proven Merlin.
//
//  RO builds this curve at :FOR[zTestFlight] from ignitionDynPresFailMultiplier=1.0, and a same-pass
//  edit cannot beat RO's own default (Crew2_Patches sorts BEFORE RealismOverhaul), so flatten the BUILT
//  curve here at :FINAL - a flat 1.0 = no high-q penalty, ignition stays at the base 0.99995 everywhere.
@PART[TE_19_F9_S1_Engine]:FINAL:NEEDS[TestFlight]
{
	@MODULE[TestFlightFailure_IgnitionFail],*
	{
		@CONFIG,*
		{
			// Delete the whole NODE and re-add it flat. (FloatCurve `key = ...` are VALUES, not nodes,
			// so `!key,* {}` did nothing but append - the 30 kPa→0.4 penalty stayed, flight_0824_004018.)
			!pressureCurve {}
			pressureCurve
			{
				key = 0 1
				key = 100000 1
			}
		}
	}
}


// ======================================================================================================
// FALCON 9 S1 — TEA-TEB ignition
// WAS: GameData/Crew2_Patches/F9_S1_TEATEB.cfg
// ======================================================================================================

// ============================================================================
//  Falcon 9 booster TEATEB (Merlin ignition fluid) - fixes the in-flight relight
// ============================================================================
//  RO's RO_TE_Falcon_9.cfg configures the S1 octaweb (TE_19_F9_S1_Engine) with
//  `ignitions = 4` and, per config, `IGNITOR_RESOURCE { name = TEATEB; amount = 1.0 }`.
//  But that same @PART block runs `!RESOURCE,*{}`, which DELETES every RESOURCE
//  node on the part - so the engine carries ZERO onboard TEATEB.
//
//  TEATEB is defined NO_FLOW (CommunityResourcePack/CommonResources.cfg), so it
//  cannot be drawn from anywhere else on the vessel - it MUST be stored on the
//  engine part that consumes it. With none there, the pad start still works (it
//  is ignited by ground support through the clamp), but the FIRST in-flight
//  relight - the booster entry burn - finds no TEATEB and will not light:
//
//      *RF* part Falcon 9/Heavy Full Thrust Octoweb requested 1 TEATEB but got 0
//
//  The booster then falls as a dead ~66 t stick and breaks up at ~44 km / mach 7
//  (KSP.log 2026-08-22, flight_0822_112918: S1.Tank + S1.Interstage Exploded).
//  The S2 M-Vac is unaffected - it carries its own ignitor fluid and lights fine.
//
//  This adds onboard TEATEB back to the octaweb. 8 units at density 0.00070031 t
//  is ~5.6 kg - negligible on a ~400 t booster - and covers the three planned
//  in-flight-capable ignitions (ascent / entry / landing) with retry margin;
//  `ignitions = 4` per config caps it regardless. `flowMode = NO_FLOW` means it
//  is only ever drawn by this part's own engines, exactly as intended.
//
//  :FINAL so no later RealismOverhaul / RealFuels pass strips it. To remove this
//  fix, delete the GameData/Crew2_Patches folder. KSP must be restarted (and CKAN
//  closed) for a config change to load.
// ============================================================================
//  2026-08-27: raised to 100 units for UNLIMITED RE-LIGHTS (user). ignitions = -1 gives an unlimited
//  ignition COUNT, but each Merlin light still consumes 1 TEATEB - so relights are only truly unlimited
//  with plenty of ignitor fluid aboard. 100 units (~70 g, negligible) covers any mission's relights.
@PART[TE_19_F9_S1_Engine]:FINAL
{
	RESOURCE
	{
		name = TEATEB
		amount = 100
		maxAmount = 100
	}
}

//  ⛔ S2 M-Vac (TE_19_F9_S2_Engine) ALSO needs TEATEB to light - it carries its own (Tundra ships 4
//  units), but 4 caps its relights. Raise it to 100 too so SES-1 / SES-2 / any contingency relight
//  never runs out of ignitor. (The S2 in-flight IGNITION failure itself was ULLAGE, fixed in code.)
@PART[TE_19_F9_S2_Engine]:FINAL
{
	@RESOURCE[TEATEB]
	{
		@amount = 100
		@maxAmount = 100
	}
}


// ======================================================================================================
// FALCON 9 — engine spool
// WAS: GameData/Crew2_Patches/F9_Engines_InstantSpool.cfg
// ======================================================================================================

// ============================================================================================
//  DragonScreen - Tundra Exploration engines: INSTANT SPOOL + UNLIMITED RELIGHTS
//
//  THE PROBLEM (user-confirmed, 2026-08-25): toggling the octaweb engine mode creates a ~2-4 s pause
//  where the stage free-falls. Stock KSP engines switch instantly; RealFuels (RO) does not.
//
//  ROOT CAUSE (from the craft dump + RealFuels source): the octaweb's three modes are three separate
//  ModuleEnginesRF - engineID AllEngines (all 9), ThreeLanding (3), CenterOnly (1) - and they are FULL
//  thrust levels, not additive. Switching mode SHUTS the current module and ACTIVATES the next, which
//  then SPOOLS UP FROM ZERO at RealFuels' throttleResponseRate (the "Effective Spool-Up Time", ~3.9 s
//  on the octaweb). That spool IS the free-fall. It also spools at every launch/relight.
//
//  THE FIX: set throttleResponseRate to RealFuels' own instant value (1E6 - ModuleEnginesRF.cs does
//  exactly this for instant-throttle engines: "if (instant) responseRate = 1E6f"), so a newly-lit or
//  mode-switched module reaches thrust immediately - no gap. Plus unlimited ignitions so relights never
//  run out. The real Falcon sheds engines (instant) rather than spooling a fresh module, so instant is
//  the faithful analogue for this vehicle's full-level modes. Keeps the STOCK octaweb (AllEngines = all
//  9 = full launch thrust), so nothing about the launch changes except that thrust builds instantly.
//
//  ⛔ MUST BE SET IN THE CONFIG: ModuleEngineConfigs writes throttleResponseRate = 0 to any CONFIG that
//  omits it, which triggers the slow computed default - so setting it on the live module is overwritten.
//  Set it on every CONFIG. :FINAL so no later pass (TestFlight, RealFuels-Stock) overrides it.
//  ⛔ ONE STATEMENT PER LINE (ModuleManager is newline-delimited).
//  ⛔ REVERSIBLE: delete this file + restart KSP to restore the stock spool + 4-ignition limit.
//
//  Scope: all Tundra Exploration engine parts (TE_* and TE2_* with a RealFuels ModuleEngineConfigs).
// ============================================================================================

//  ⛔ 2026-08-26 FIX (from flight_0826_014654 + ModuleManager.ConfigCache ground truth): the previous
//  form `@MODULE[ModuleEngineConfigs] { @CONFIG[*] {...} }` matched only the FIRST module and its FIRST
//  config, so of the octaweb's 9 configs (3 ModuleEngineConfigs modules - engineID AllEngines / ThreeLanding
//  / CenterOnly - each with Merlin1D / Merlin1D+ / Merlin1D++) ONLY AllEngines/Merlin1D got instant spool.
//  The ConfigCache proved it: `throttleResponseRate = 1000000` appeared ONCE, `ignitions = -1` ONCE, while
//  `ignitions = 4` still appeared 6 times. Result: the ENTRY-BURN mode (ThreeLanding) and LANDING mode
//  (CenterOnly) still spooled from zero - the booster fell ~3.2 s / 781 m during the landing-engine spool
//  (i=1808..1824) and ~3.3 s during the entry-burn spool. FIX: `,*` on BOTH the MODULE and the CONFIG
//  selector so EVERY module and EVERY config variant is patched. (Same idiom the reliability patch uses:
//  `@MODULE[Module*EngineConfigs],* { @CONFIG[Merlin1D*],* {...} }`.)

@PART[TE_*]:HAS[@MODULE[ModuleEngineConfigs]]:FINAL
{
	@MODULE[ModuleEngineConfigs],*
	{
		@CONFIG[*],*
		{
			%throttleResponseRate = 1000000
			%ignitions = -1
		}
	}
}

@PART[TE2_*]:HAS[@MODULE[ModuleEngineConfigs]]:FINAL
{
	@MODULE[ModuleEngineConfigs],*
	{
		@CONFIG[*],*
		{
			%throttleResponseRate = 1000000
			%ignitions = -1
		}
	}
}


// ======================================================================================================
// TAC-LS CO2 + WASTEWATER CAPACITY — the crew-killing defect
// NEW — never installed; see FINDINGS_GAME_INSTALL.md §6.3
// ======================================================================================================

// =============================================================================================
// FIX — TAC-LS waste capacity on the Tundra / RO Dragon parts
//
// THE DEFECT, MEASURED 2026-09-09
//   RealismOverhaul/RO_SuggestedMods/TundraMods/*.cfg set  CarbonDioxide maxAmount = 300
//   on every part, as a copy-pasted literal:
//       RO_TE_Dragon_1.cfg:220   RO_TE_Dragon_2.cfg:105   RO_TE_Dragon_2.cfg:419
//       RO_TT_Haven.cfg:77
//   The same parts carry Oxygen 34400.7 — 232 days for one crew.
//
//   TAC-LS sizes EVERY tank, supply AND waste, to the SAME duration. Its own defaults
//   (ThunderAerospace/TacLifeSupport/MM_AddResources.cfg, per crew capacity):
//       Food 1.097 · Water 0.725 · Oxygen 111.038 · CO2 95.913 · Waste 0.1 · WasteWater 0.924
//   Against the rates in LifeSupport.cfg every one of those is 64,800 s = 18.0 h. Exactly.
//
//   So waste capacity must scale with supply. At the Dragon's Oxygen load it should be:
//       CarbonDioxide  29,714.8      config has 300     -> 99x SHORT
//       WasteWater        286.3      config has 200     -> 1.4x short
//       Waste              31.0      config has  50     -> fine, left alone
//
//   OBSERVED CONSEQUENCE (owner, 2026-09-09): crew died of CO2 poisoning.
//   At 4 crew the CO2 tank fills in 0.59 days while the oxygen gauge still reads 58 days.
//
// THE RATIOS BELOW ARE TAC-LS'S OWN, NOT INVENTED
//       CO2       / Oxygen = 95.913 / 111.038 = 0.8637890
//       WasteWater/ Oxygen =  0.924 / 111.038 = 0.0083215
//
// ⚠ NOT TESTED IN GAME. Written by the overseer, for the owner to review and install.
//   The overseer does not write to GameData.
//
// ⚠ ALTERNATIVE EXPLANATION WORTH RULING OUT FIRST: these tanks are RealFuels
//   `ModuleFuelTanks` TANK entries, not stock RESOURCE nodes. If venting/dumping waste
//   behaves differently inside a RealFuels tank than in a stock one, THAT is the root
//   cause and this patch only widens the symptom's margin. Either way the capacity is
//   wrong by TAC-LS's own ratios, so this is worth having regardless.
//
// INSTALL: save as GameData/LocalFixes/TACLS_CO2_Capacity.cfg  (LocalFixes already exists)
// =============================================================================================

// Scale CO2 capacity from the part's OWN Oxygen load, so it works for any Tundra part
// and for any future change to the oxygen figure.
@PART[*]:HAS[@MODULE[ModuleFuelTanks]:HAS[@TANK[Oxygen],@TANK[CarbonDioxide]]]:AFTER[RealismOverhaul]
{
    @MODULE[ModuleFuelTanks]
    {
        @TANK[CarbonDioxide]
        {
            @maxAmount = #$../TANK[Oxygen]/maxAmount$
            @maxAmount *= 0.8637890
        }
        @TANK[WasteWater]
        {
            @maxAmount = #$../TANK[Oxygen]/maxAmount$
            @maxAmount *= 0.0083215
        }
    }
}

// Same again for any part where TAC-LS added plain RESOURCE nodes rather than RealFuels tanks.
@PART[*]:HAS[@RESOURCE[Oxygen],@RESOURCE[CarbonDioxide],!MODULE[ModuleFuelTanks]]:AFTER[RealismOverhaul]
{
    @RESOURCE[CarbonDioxide]
    {
        @maxAmount = #$../RESOURCE[Oxygen]/maxAmount$
        @maxAmount *= 0.8637890
    }
    @RESOURCE[WasteWater]
    {
        @maxAmount = #$../RESOURCE[Oxygen]/maxAmount$
        @maxAmount *= 0.0083215
    }
}
