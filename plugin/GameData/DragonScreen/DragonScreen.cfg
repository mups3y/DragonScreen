// ============================================================================================
//  DragonScreen - light up the Crew Dragon IVA displays
//
//  Tundra Exploration already models the interior accurately. TE_CD2_IVA_SCREEN.cfg carries
//      MODULE { name = internalGeneric }
//  which is static art with zero functionality - three correctly placed displays showing a painted
//  texture. This patch adds one DragonScreenMonitor per display, which swaps that painted texture
//  for a live RenderTexture.
//
//  WE ARE NOT BUILDING SCREEN GEOMETRY. The hard part - accurate shape, correct placement, matching
//  materials - is done and is not ours. See docs/IVA_TARGET.md.
//
//  ---- WHY THE PROP AND NOT THE PART ----
//  The screens are IVA props, so the module must be an InternalModule on the PROP. A PartModule on
//  the pod cannot reach into the internal model's transforms, and a KSPAddon has no prop to attach
//  to. This is also why there is no ModuleManager patch on any PART in this mod at all.
//
//  ---- THREE SCREENS, THREE MODULES, THREE RenderTextures ----
//  Not one texture split three ways. The real capsule's displays show different things at the same
//  time, and a shared texture would force them to be one page in three windows. Each module owns its
//  own RenderTexture and its own camera; screenIndex only tells the proof pattern which is which.
//
//  ---- _MainTex, NOT _Emissive ----
//  The screen material TE_CD2_PROP_SCREENS_TXT is shader KSP/Diffuse. MAS defaults to _Emissive
//  because ASET's props are emissive; copying that default here would write to a slot that does not
//  exist and change nothing, with no error. The slot is a field so it can be corrected without a
//  rebuild, and the module logs whether the material actually has it.
//
//  ---- THERE IS NO screenHeight HERE, AND THAT IS DELIBERATE ----
//  The first flight ran 1024x640 - the Figma reference aspect, 1.6:1 - and the proof pattern's
//  circle came back a visibly wide ellipse. These screens are nearer 2:1. The module now MEASURES
//  the screen mesh and derives the height, so width is the only resolution knob and the page can
//  never be silently stretched. Setting screenHeight here overrides that; leave it out.
//
//  ---- defaultPage IS A STARTING SELECTION, NOT AN ASSIGNMENT ----
//  All three screens are the same screen and any of them can show any page - that is what the real
//  capsule does, and it is why no public source documents a page-per-screen layout. These three
//  values only decide what a vessel shows before the crew has touched anything; after that the
//  persisted selection wins. Reasoning for each choice is in docs/REAL_DRAGON_SCREENS.md.
//
//  ---- fontName MUST MATCH PreviewMain.FontFamily ----
//  Unity's CreateDynamicFontFromOSFont only sees fonts INSTALLED IN WINDOWS, and an uninstalled
//  name silently substitutes rather than failing - so the painter logs what it actually resolved.
//  D-DIN - the family the real capsule uses - is bundled under the OFL in assets/d-din and was
//  INSTALLED PER-USER on 2026-08-05, so it is available to both the game and the PNG preview.
//  Also available: "D-DIN Condensed" and "D-DIN Exp". The family names were read out of the files,
//  not assumed, and they match the OFL reserved names.
//  If this and PreviewMain.FontFamily ever disagree, the preview is lying about the real page.
//
//  :NEEDS[TundraExploration]  - the prop only exists if Tundra is installed.
//  :FINAL                     - land after any Tundra or FreeIva patching of the same prop.
// ============================================================================================
@PROP[TE_CD2_IVA_SCREEN]:NEEDS[TundraExploration]:FINAL
{
    MODULE
    {
        name = DragonScreenMonitor
        screenTransform = TT_CD2_IVA_SCREEN1
        screenIndex = 1
        screenWidth = 1280
        fontName = D-DIN
        captureOnLoad = true
        // LEFT - commander's side. Subsystems, consumables and alerts.
        defaultPage = VEHICLE
        // BOTH OFF - they answered. The console collider is a MeshCollider on layer 16, and a
        // BoxCollider nested inside it WINS the hit: probe B fired, probe A never did. So a collider
        // per button and per screen is the design. Recorded in docs/REAL_DRAGON_SCREENS.md.
        dumpTransforms = false
        probeInput = false
    }
    MODULE
    {
        name = DragonScreenMonitor
        screenTransform = TT_CD2_IVA_SCREEN2
        screenIndex = 2
        screenWidth = 1280
        fontName = D-DIN
        captureOnLoad = true
        // CENTRE - shared by both seats. Telemetry strip and the Dragon illustration.
        defaultPage = FLIGHT
    }
    MODULE
    {
        name = DragonScreenMonitor
        screenTransform = TT_CD2_IVA_SCREEN3
        screenIndex = 3
        screenWidth = 1280
        fontName = D-DIN
        captureOnLoad = true
        // RIGHT - pilot's side. Trajectory, ground track, orbit.
        defaultPage = NAV
    }
}

// ============================================================================================
//  PERSISTENCE - the page each screen shows has to survive.
//
//  Internal models are torn down and rebuilt whenever the camera mode changes, so a selection held
//  in the InternalModule dies with them, and dies again on every save/load. DragonScreenState is a
//  PartModule, so it lives with the PART and its [KSPField(isPersistant = true)] goes into the save.
//  MAS reached the same arrangement (MASMonitor reads its page from a persistent value on
//  MASFlightComputer, a PartModule) - that agreement is the evidence it is right.
//
//  ---- BOTH V2 PODS, AND THEY USE DIFFERENT INTERNALS ----
//      TE_18_DRAGONV2_POD      -> internal TE_CD2_IVA
//      TE_18_DRAGONV2_POD_I4   -> internal TE_CD2_IVA_CUPOLA
//  Checked in game files, not assumed. BOTH internals place the same TE_CD2_IVA_SCREEN prop, which
//  is why the @PROP patch above already covers both - but a PART patch has to name both parts.
//
//  Not patched: TE_19_C-Dragon_Pod (Gigan - a different vehicle) and TE_20_CargoRodan (no crew, no
//  screens). Adding a module to a pod that can never draw a screen is pure clutter.
// ============================================================================================
@PART[TE_18_DRAGONV2_POD|TE_18_DRAGONV2_POD_I4]:NEEDS[TundraExploration]:FINAL
{
    MODULE
    {
        name = DragonScreenState
    }
}

// ============================================================================================
//  THE ONE EMBEDDED MechJebCore - headless (register T15b, §B12.1 / §B12.1a)
//
//  ---- THE DRAGON PARTS ONLY. NEVER EVERY COMMAND POD ----
//  The vendored tree contains MechJeb's own Parts/MechJebNoCommandPod.cfg, which adds a core to
//  EVERY command pod in the game. It is source-only - `install` copies GameData/DragonScreen and
//  nothing from plugin/mech - and this patch must never reintroduce it. The two parts named here
//  are the same two DragonScreenState patches, for the same reason: they are the vehicle this mod
//  is about.
//
//  ---- WHY THE NAME IS NOT `MechJebCore` ----
//  §B3's private namespace stops a TYPE clash with a user's MechJeb2.dll. It does not stop this
//  one: KSP resolves a MODULE name by CLASS NAME across every loaded assembly, and after the
//  namespace wrap our class is still called MechJebCore, so a node naming it would be ambiguous
//  on any machine that also has the real MechJeb - and could hand this Dragon THEIR core, GUI and
//  all. DragonMechJebCore is a subclass with a name nothing else can answer to. See src/MechHost.cs.
//  ⚠ T15d, 2026-09-05: that closes OUR node's direction only. The REVERSE - somebody else's
//  MODULE{name=MechJebCore} node being answered by OUR class, which builds a bare core carrying none
//  of MechHost's overrides - was open, and is the leading explanation of all three failures the
//  owner's glass run found. It is closed in code, not here: MechCoreNameGuard + NeuterForeignCores,
//  src/MechHost.cs item (7). Nothing in THIS file changed for it.
//
//  ---- AND THIS CORE DOES NOT FLY ANYTHING ----
//  DragonMechJebCore holds MechJebCore.running = false, so it is never the vessel's master core:
//  Drive, OnGUI, the 5-second settings save, the toolbar button and FixedUpdate are all gated on
//  that one field. T18 turns it on deliberately via AuthorizeDrive(true) and nothing else can - the
//  PAW toggle for it is hidden. src/MechHost.cs item (6); plan §B12.1c.
//
//  ---- blacklist IS A SUBSTRING MATCH, NOT A LIST ----
//  MechJebCore tests `!blacklist.Contains(t.Name)` (MechJebCore.cs:753), so an entry refuses every
//  module whose name is a SUBSTRING of this string - including ones nobody named. These six were
//  checked against the whole pinned tree and refuse exactly six; `build.py test` re-proves it every
//  build (test/MechHostTest.cs) against the tree itself, not against a list someone typed.
//  ⛔ DO NOT EDIT THIS LINE HERE. It is generated from pure/MechProfile.Blacklist, which carries
//  the reasoning per entry, and the test fails if the two disagree.
//
//  ---- AND THE GUI IS NOT SUPPRESSED BY THIS LINE ----
//  It cannot be: MechJebModuleMenu, MechJebModuleCustomWindowEditor, MechJebModuleThrustWindow and
//  MechJebModuleAscentMenu are all dereferenced with no null check from code that runs every frame,
//  so refusing them would crash rather than hush. They are constructed and held disabled instead,
//  in src/MechHost.cs. Blacklist = "never built"; MechHost = "never shown".
//
//  tuneFile is read from GameData/DragonScreen/PluginData/ - inside this mod, never the user's
//  MechJeb (§B12.1). ⚠ That file is the TUNED Crew-2 profile, i.e. §B5's TUNING TARGET; §B5 says
//  flight 1 flies RSS-RO DEFAULTS. Blank this field to load nothing. T22 makes that call.
// ============================================================================================
@PART[TE_18_DRAGONV2_POD|TE_18_DRAGONV2_POD_I4]:NEEDS[TundraExploration]:FINAL
{
    MODULE
    {
        name = DragonMechJebCore
        blacklist = MechJebModuleDebugArrows,MechJebModuleAttitudeAdjustment,MechJebModuleDockingGuidance,MechJebModuleNodeEditor,MechJebModuleRendezvousGuidance,MechJebModuleSmartRcs
        tuneFile = mechjeb_settings_type_Crew-Dragon.cfg
    }
}

// NOTE: this mod patches NO engine/RCS/gimbal values. The autopilot (which retuned the Draco RCS and
// gimbal to fly the vehicle) was removed 2026-09-01 — DragonScreen is the IVA SCREENS only, so the
// craft flies on its stock RO/Tundra propulsion untouched.
