// ======================================================================================================
// HABTECH2 / ISS — RO fix
// WAS: GameData/zzz_TundraRO_Fixes/HabTech2_ROFix.cfg
// ======================================================================================================

// ============================================================================================
//  HabTech2 - Realism Overhaul fix   (DragonScreen / Crew-1 RSS build, 2026-08-22)
//
//  PROBLEM 1: RO's HardRemoveNonRO cleanup deletes every part lacking `RSSROConfig = True`:
//      !PART:HAS[~RSSROConfig[True]]:BEFORE[zzzTagCleanup]:NEEDS[HardRemoveNonRO]
//  The bundled RO_HabTech2 config only tags a fixed LIST of parts - the pressurized modules and
//  the OLD truss parts (ht2_truss_S0, ht2_solarArray_duo, ht2_radiatorTriple). The modern USOS
//  uses different parts (ht2_ITS_S0/S1, ht2_P6_SAW/S6_SAW, ht2_TTS_*, ht2_radiatorTriple.v2, the
//  robotics, antennas, payloads) which are NOT in that list, so ~83 parts get stripped.
//
//  PROBLEM 2 (the end gaps): scale is NON-UNIFORM. RO sets its covered parts to 1.81 but the
//  Cupola to 2, and the parts it never covers keep whatever native rescaleFactor they shipped
//  with. A stock-scale craft repositioned by a flat x1.81 only lines up if EVERY part is 1.81.
//
//  FIX: (A, :FIRST) tag every HabTech2/htRobotics part RSSROConfig=True so none are stripped;
//       (B, :FINAL) strip all rescaleFactor lines and force a single clean 1.81 on every one of
//       them, so the whole station is one uniform scale and the x1.81 reposition is exact.
//  Cost: the Cupola ends up ~10% smaller than RO's ideal (1.81 vs 2) - cosmetic, and worth it for
//  a gapless station. Geometry is all that matters here; it is HyperEdited to orbit, not launched.
// ============================================================================================

// ---- (A) survive HardRemoveNonRO. ScienceBox is a stock box the USOS craft uses; tag it too. ----
@PART[ht2_*|ht_*|ScienceBox]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul]:FIRST
{
    %RSSROConfig = True
}

// ---- (B) UNIFORM 1.81 scale on every HabTech2/htRobotics part - overrides RO's Cupola=2 and any
//         native rescaleFactor, so every junction matches the x1.81 craft reposition. ----
@PART[ht2_*|ht_*|ScienceBox]:NEEDS[RealismOverhaul]:FINAL
{
    !rescaleFactor,* = DEL
    %rescaleFactor = 1.81
}


